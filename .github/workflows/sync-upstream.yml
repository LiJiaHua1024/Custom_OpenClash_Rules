name: Sync upstream

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: main-writers
      cancel-in-progress: false
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      before: ${{ steps.merge.outputs.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Merge and validate upstream
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/Aethersailor/Custom_OpenClash_Rules.git main
          upstream=$(git rev-parse FETCH_HEAD)
          before=$(git rev-parse HEAD)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$upstream" HEAD; then
            echo 'merged=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp .github/scripts/check-personal-config.cjs "$RUNNER_TEMP/check-personal-config.cjs"
          if ! git merge --no-commit --no-ff "$upstream"; then
            echo 'Upstream merge has conflicts; nothing was pushed.' >&2
            exit 1
          fi
          node "$RUNNER_TEMP/check-personal-config.cjs"
          git diff --check --cached -- cfg/Custom_Clash.ini cfg/Custom_Clash_Mainland.ini
          git commit -m 'chore: merge upstream updates'
          git push origin HEAD:main
          echo 'merged=true' >> "$GITHUB_OUTPUT"

  generate-derived-rules:
    needs: sync
    if: needs.sync.outputs.merged == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/auto-generate-rules.yml
    with:
      source_before_sha: ${{ needs.sync.outputs.before }}
